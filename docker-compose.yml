services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    healthcheck:
      # без -h pg_isready идет через сокет и может ответить временный сервер initdb
      test: ["CMD-SHELL", "pg_isready -h localhost -U checkstock -d checkstock"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://checkstock:checkstock@db:5432/checkstock
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
